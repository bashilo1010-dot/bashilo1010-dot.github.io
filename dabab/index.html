<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F5BD8">
<title>דבב</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="דבב">
<!-- דבב: interview sheets for soldiers. One file, works offline; everything is stored only on this device
     (localStorage, optionally encrypted with a code). The Android app (android/) wraps this same page and adds
     saving/sharing files, printing to PDF and voice typing through window.DababAndroid. -->
<style>
:root {
  --bg: #F4F6FB; --card: #FFFFFF; --line: #E2E7F0; --text: #14213D; --soft: #5B6680; --faint: #8C96AB;
  --acc: #1F5BD8; --acc2: #E8EFFD; --ok: #12A150; --okbg: #E5F6EC; --warn: #D9480F; --warnbg: #FDEDE6; --yel: #B7791F; --yelbg: #FEF5E0;
  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 4px 16px rgba(20,33,61,.06); --r: 16px; --fs: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
  --bg: #0E1320; --card: #171E2E; --line: #273149; --text: #EEF2FA; --soft: #A9B3C8; --faint: #76819A;
  --acc: #5C8BFF; --acc2: #1C2A4A; --ok: #3DD68C; --okbg: #13301F; --warn: #FF7A4D; --warnbg: #3A1F14; --yel: #F2B544; --yelbg: #3A2D12;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); } }
:root[data-theme=dark] {
  --bg: #0E1320; --card: #171E2E; --line: #273149; --text: #EEF2FA; --soft: #A9B3C8; --faint: #76819A;
  --acc: #5C8BFF; --acc2: #1C2A4A; --ok: #3DD68C; --okbg: #13301F; --warn: #FF7A4D; --warnbg: #3A1F14; --yel: #F2B544; --yelbg: #3A2D12;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); }
:root.big { --fs: 19px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs)/1.5 system-ui, -apple-system, "Segoe UI", Rubik, Arial, sans-serif; }
body { min-height: 100vh; padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
header.top h1 { flex: 1; margin: 0; font-size: 1.25em; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--soft); flex: none; }
.icon-btn:active, .icon-btn:hover { background: var(--acc2); color: var(--acc); }
.icon-btn svg, .btn svg { width: 22px; height: 22px; }
main { max-width: 760px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
.muted { color: var(--soft); font-size: .9em; }
.faint { color: var(--faint); font-size: .85em; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 12px; font-weight: 700;
  background: var(--acc2); color: var(--acc); min-height: 46px; }
.btn.primary { background: var(--acc); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn.danger { background: var(--warnbg); color: var(--warn); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }
.fab { position: fixed; left: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 6; border-radius: 18px; padding: 14px 20px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--acc) 40%, transparent); }
input[type=text], input[type=tel], input[type=number], input[type=date], input[type=search], input[type=password], textarea, select {
  width: 100%; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; outline: none; min-height: 48px; }
input:focus, textarea:focus, select:focus { border-color: var(--acc); background: var(--card); }
textarea { resize: vertical; min-height: 70px; }
label.lbl { display: block; font-weight: 700; margin: 10px 2px 6px; font-size: .92em; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
  margin-bottom: 8px; box-shadow: var(--shadow); width: 100%; text-align: start; }
.list-item:active { transform: scale(.99); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; font-size: 1.05em; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.badge { font-size: .74em; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--warnbg); color: var(--warn); }
.badge.y { background: var(--yelbg); color: var(--yel); }
.badge.ok { background: var(--okbg); color: var(--ok); }
.badge.b { background: var(--acc2); color: var(--acc); }
.ring { --p: 0; width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: .72em; font-weight: 800;
  background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 32px; height: 32px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
.tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); padding: 5px; border-radius: 14px; margin-bottom: 12px; }
.tabs button { flex: 1; padding: 9px; border-radius: 10px; font-weight: 700; color: var(--soft); }
.tabs button.on { background: var(--acc); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; min-height: 44px; }
.chip.on { border-color: var(--acc); background: var(--acc); color: #fff; }
.qnum { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 9px; background: var(--acc2); color: var(--acc); font-weight: 800; font-size: .85em; }
.qtitle { font-size: 1.05em; font-weight: 800; }
.wiz .qtitle { font-size: 1.45em; line-height: 1.3; margin: 10px 0 16px; }
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--acc); transition: width .25s; }
.wiz-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.wiz-nav .btn { flex: 1; }
.sub { display: grid; gap: 8px; }
.inline-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.calc { display: inline-block; margin-top: 6px; font-weight: 700; color: var(--acc); font-size: .9em; }
.note { margin-top: 10px; }
.with-mic { position: relative; }
.with-mic .mic { position: absolute; left: 6px; top: 6px; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--soft); }
.with-mic .mic.on { color: #fff; background: var(--warn); }
.with-mic input, .with-mic textarea { padding-left: 50px; }
.skipped { border-style: dashed !important; opacity: .85; }
.empty { text-align: center; padding: 40px 16px; color: var(--soft); }
.empty svg { width: 64px; height: 64px; color: var(--faint); }
.banner { display: flex; gap: 10px; align-items: center; background: var(--yelbg); color: var(--yel); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; }
.sheet-bg { position: fixed; inset: 0; background: rgba(10,15,30,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 640px; max-height: 90vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 12px; font-size: 1.2em; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; } }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 10px; border-radius: 12px; text-align: start; font-weight: 600; }
.menu-item:active, .menu-item:hover { background: var(--acc2); }
.menu-item svg { width: 22px; height: 22px; color: var(--soft); }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; z-index: 40;
  background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 700; transition: .25s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 1.4em; }
.bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: .9em; }
.bar .track { flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--acc); }
.check-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; }
.check-row input { width: 22px; height: 22px; accent-color: var(--acc); flex: none; }
.lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 24px; }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin: 18px 0; }
.pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--acc); }
.pin-dots i.on { background: var(--acc); }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; justify-content: center; direction: ltr; }
.keypad button { height: 64px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); font-size: 1.5em; font-weight: 700; }
.drag-row { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; background: var(--card); }
.ltr { direction: ltr; unicode-bidi: isolate; }
#printArea { display: none; }
@media print { body > *:not(#printArea) { display: none !important; } #printArea { display: block !important; } body { background: #fff; padding: 0; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<datalist id="cities"></datalist>

<script>
'use strict';
// ====================================================================== icons
const I = {
  back: '<path d="M9 18l6-6-6-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  dots: '<circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>',
  share: '<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4M12 2v14"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  wa: '<path d="M3 21l1.6-4.8A8.5 8.5 0 1 1 8 19.6L3 21z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 1c-1-.5-1.5-1-2-2l1-1-1-2-1.5 1z"/>',
  mic: '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  up: '<path d="M18 15l-6-6-6 6"/>', down: '<path d="M6 9l6 6 6-6"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  cake: '<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1M2 21h20M7 8v3M12 8v3M17 8v3M7 4h.01M12 4h.01M17 4h.01"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  skip: '<path d="M5 4l10 8-10 8V4zM19 5v14"/>',
};
const svg = (n, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${I[n]}</svg>`;

// ====================================================================== the default questions
const BANKS = ['לאומי', 'הפועלים', 'דיסקונט', 'מזרחי טפחות', 'הבינלאומי', 'מרכנתיל', 'יהב', 'ירושלים', 'אוצר החייל', 'מסד', 'פאגי', 'בנק הדואר', 'וואן זירו'];
const RELATIONS = ['אבא', 'אמא', 'אח', 'אחות', 'בן/בת זוג', 'סבא/סבתא', 'דוד/דודה', 'חבר/ה'];
const YESNO = ['כן', 'לא'];
function defaultTemplate() {
  let n = 0;
  const q = (title, type, more = {}) => ({ id: 'q' + (++n), title, type, ...more });
  return [
    q('ת"ז', 'number', { sensitive: true, key: 'id' }),
    q('מספר אישי', 'number', { sensitive: true, key: 'pn' }),
    q('טלפון', 'phone', { sensitive: true, key: 'phone' }),
    q('תאריך לידה', 'date', { calc: 'age', key: 'birth' }),
    q('עיר', 'city'),
    q('כתובת', 'text', { sensitive: true }),
    q('סטטוס', 'choice', { options: ['רווק/ה', 'בזוגיות', 'נשוי/אה', 'גרוש/ה', 'אלמן/ה'] }),
    q('איש קשר למקרה אסון', 'group', { sensitive: true, fields: [{ id: 'name', label: 'שם', type: 'text' }, { id: 'rel', label: 'קרבה', type: 'choice', options: RELATIONS }, { id: 'phone', label: 'טלפון', type: 'phone' }] }),
    q('בנק', 'group', { sensitive: true, fields: [{ id: 'bank', label: 'בנק', type: 'choice', options: BANKS }, { id: 'branch', label: 'סניף', type: 'number' }, { id: 'acc', label: 'מספר חשבון', type: 'number' }] }),
    q('תפקיד', 'text', { key: 'role' }),
    q('תאריך גיוס', 'date', { calc: 'service' }),
    q('כשירות', 'text'),
    q('כשרות', 'choice', { options: ['לא שומר/ת', 'כשר', 'מהדרין'] }),
    q('טלפון כשר?', 'choice', { options: YESNO }),
    q('תזונה', 'choice', { options: ['רגילה', 'צמחונית', 'טבעונית', 'ללא גלוטן'] }),
    q('אלרגיה?', 'choice', { options: YESNO, alert: 'אלרגיה' }),
    q('אפיפן?', 'choice', { options: YESNO, alert: 'אפיפן' }),
    q('מצב רפואי / פטורים', 'text', { alert: 'רפואי' }),
    q('נוטל תרופות באופן קבוע?', 'choice', { options: YESNO, alert: 'תרופות' }),
    q('יצא לך להיפגש / רוצה להיפגש עם פסיכולוג / קב"ן?', 'choice', { options: ['לא', 'נפגש/ה בעבר', 'רוצה להיפגש'], alert: 'קב"ן', alertOn: ['רוצה להיפגש'] }),
    q('פרופיל וסעיפים', 'text'),
    q('זכאות והקלות בת"ש? יצא לך לראות משקית ת"ש?', 'text'),
    q('חופשות ובקשצ"ים', 'text'),
    q('חריג ממ (דברים שממ צריך לדעת)', 'text', { alert: 'חריג ממ' }),
    q('הערות: עוד דברים שהחייל רוצה להוסיף ולשתף על מצבו', 'text', { long: true }),
    q('הקלות בלימודים?', 'choice', { options: YESNO }),
  ];
}

const KEY = 'dabab.v1', ENC = 'dabab.enc.v1', META = 'dabab.meta';

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function blank() { return { template: defaultTemplate(), soldiers: {}, lists: [], settings: { interviewer: '', big: false, mode: 'wizard', lastBackup: 0, theme: 'auto' } }; }
function meta() { try { return JSON.parse(localStorage.getItem(META) || '{}'); } catch (e) { return {}; } }
function setMeta(m) { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) {} }

const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, salt) {

}
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const go = async () => {
    try {
      const json = JSON.stringify(S);
      if (pinKey) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, pinKey, new TextEncoder().encode(json));
        localStorage.setItem(ENC, b64(iv) + '.' + b64(ct));

        localStorage.removeItem(ENC);

  };

  saveTimer = setTimeout(go, 350);
}

  const [iv, ct] = localStorage.getItem(ENC).split('.');
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(ct));   // throws on a wrong code

}

}

const COLORS = ['#1F5BD8', '#12A150', '#D9480F', '#7048E8', '#0C8599', '#C2255C', '#E67700', '#2F9E44'];
const colorFor = s => COLORS[[...(s.id || 'x')].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];

// ---------- the status picture: medical alerts, summaries, what's missing, birthdays
function statusView(body, sol) {
  if (!sol.length) { body.innerHTML = `<div class="empty"><p>אין עדיין חיילים ברשימה.</p></div>`; return; }
  const withAl = sol.filter(s => alerts(s).length);

    const b = new Date(v); let next = new Date(today.getFullYear(), b.getMonth(), b.getDate());
    const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    if (next < t0) next = new Date(today.getFullYear() + 1, b.getMonth(), b.getDate());
    const days = Math.round((next - t0) / 864e5);
    return days <= 31 ? { s, days, turns: next.getFullYear() - b.getFullYear(), date: next } : null;
  }).filter(Boolean).sort((a, b) => a.days - b.days) : [];
  body.innerHTML = `
    <div class="card"><div class="row" style="margin-bottom:8px">${svg('alert', 'width="22" height="22" style="color:var(--warn)"')}<b class="grow">התראות רפואיות (${withAl.length})</b></div>

      ${withAl.length ? `<div class="faint" style="margin-top:6px">${withAl.map(s => S.template.filter(q => q.alert && alerts(s).includes(q.alert)).map(q => { const a = ans(s, q); const d = [a.other, a.note].filter(Boolean).join(' · '); return d ? `${esc(fullName(s))} – ${esc(q.alert)}: ${esc(d)}` : ''; }).filter(Boolean).join('<br>')).filter(Boolean).join('<br>')}</div>` : ''}</div>
    <div class="card"><div class="row" style="margin-bottom:8px">${svg('cake', 'width="22" height="22" style="color:var(--acc)"')}<b class="grow">ימי הולדת בחודש הקרוב</b></div>
      ${bdays.length ? bdays.map(x => `<div class="row" style="padding:6px 2px"><span class="grow">${esc(fullName(x.s))} <span class="faint">(בן/בת ${x.turns})</span></span><span class="badge ${x.days === 0 ? 'ok' : x.days <= 7 ? 'y' : 'b'}">${x.days === 0 ? 'היום! 🎉' : x.days === 1 ? 'מחר' : `${x.date.getDate()}.${x.date.getMonth() + 1} · עוד ${x.days} ימים`}</span></div>`).join('') : '<div class="muted">אין ימי הולדת בחודש הקרוב</div>'}</div>
    <div class="card"><div class="row" style="margin-bottom:8px">${svg('chart', 'width="22" height="22" style="color:var(--acc)"')}<b class="grow">סיכומים</b></div>
      ${choiceQs.map(q => {
        const cnt = {}; let tot = 0;
        sol.forEach(s => { const a = ans(s, q); const v = a.value || (a.other ? 'אחר' : ''); if (v) { cnt[v] = (cnt[v] || 0) + 1; tot++; } });
        if (!tot) return '';
        return `<div style="margin:10px 0 4px;font-weight:700">${esc(q.title)}</div>` + Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
          `<div class="bar"><span style="width:110px">${esc(k)}</span><span class="track"><i style="width:${v / sol.length * 100}%"></i></span><b>${v}</b></div>`).join('');
      }).join('') || '<div class="muted">עוד אין תשובות לשאלות עם אופציות</div>'}</div>

  body.querySelectorAll('[data-s]').forEach(b => b.onclick = () => go({ name: 'soldier', id: b.dataset.s, list: route.id }));

// ====================================================================== one soldier
function inputFor(q, f, val, path) {   // f = sub-field or the question itself
  const t = f.type, v = esc(val || ''), d = `data-path="${path}"`;
  if (t === 'phone') return `<input type="tel" inputmode="tel" ${d} value="${v}" placeholder="05X-XXXXXXX" class="ltr">`;
  if (t === 'number') return `<input type="text" inputmode="numeric" ${d} value="${v}" class="ltr">`;
  if (t === 'date') return `<input type="date" ${d} value="${v}">`;
  if (t === 'city') return `<input type="text" list="cities" ${d} value="${v}" autocomplete="off">`;
  if (t === 'choice') return `<div class="chips" ${d}>${(f.options || []).map(o => `<button type="button" class="chip ${val === o ? 'on' : ''}" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  if (q.long) return micWrap(`<textarea ${d}>${v}</textarea>`);
  return micWrap(`<input type="text" ${d} value="${v}">`);
}
function questionHTML(s, q, i, big) {
  const a = ans(s, q);
  let main = '';
  if (q.type === 'group') main = `<div class="sub">${q.fields.map(f => `<div><label class="lbl">${esc(f.label)}</label>${inputFor(q, f, (a.sub || {})[f.id], q.id + '.' + f.id)}${f.type === 'phone' ? telLinks((a.sub || {})[f.id]) : ''}</div>`).join('')}</div>`;
  else {
    main = inputFor(q, q, a.value, q.id);
    if (q.type === 'choice') main += `<div style="margin-top:8px">${micWrap(`<input type="text" data-path="${q.id}.__other" value="${esc(a.other || '')}" placeholder="תשובה אחרת / פירוט">`)}</div>`;
    if (q.type === 'phone') main += telLinks(a.value);
    if (q.calc && a.value) main += `<span class="calc">${esc(calcText(q, a.value))}</span>`;
  }
  return `<div class="${big ? 'wiz' : 'card'} ${a.skipped ? 'skipped' : ''}" data-q="${q.id}" ${big ? '' : 'style="scroll-margin-top:80px"'}>
    <div class="row"><span class="qnum">${i + 1}</span><span class="grow ${big ? '' : 'qtitle'}">${big ? '' : esc(q.title)}</span>${a.skipped ? '<span class="badge y">דולג</span>' : ''}${q.alert ? `<span class="badge">${esc(q.alert)}</span>` : ''}</div>
    ${big ? `<div class="qtitle">${esc(q.title)}</div>` : ''}
    ${main}
    <div class="note">${micWrap(`<textarea data-path="${q.id}.__note" placeholder="הערה" style="min-height:${big ? 80 : 48}px">${esc(a.note || '')}</textarea>`)}</div></div>`;
}
function bindAnswers(root, s, onChange) {
  const T = Object.fromEntries(S.template.map(q => [q.id, q]));
  root.addEventListener('input', e => {
    const p = e.target.dataset && e.target.dataset.path; if (!p) return;
    const [qid, f] = p.split('.'); const q = T[qid]; if (!q) return;
    const v = e.target.value;
    if (f === '__note') setAns(s, q, { note: v });
    else if (f === '__other') setAns(s, q, { other: v, skipped: false });
    else if (f) setAns(s, q, { sub: Object.assign({}, ans(s, q).sub, { [f]: v }), skipped: false });
    else setAns(s, q, { value: v, skipped: false });
    if (e.target.type === 'date') onChange && onChange(q);
  });
  root.addEventListener('change', e => {   // a phone number: refresh the call / WhatsApp buttons once typing is done
    const p = e.target.dataset && e.target.dataset.path; if (!p || e.target.type !== 'tel') return;
    const q = T[p.split('.')[0]]; if (q) onChange && onChange(q);
  });
  root.addEventListener('click', e => {
    const c = e.target.closest('[data-opt]'); if (!c) return;
    const box = c.parentElement; const [qid, f] = box.dataset.path.split('.'); const q = T[qid];
    const on = !c.classList.contains('on');
    box.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); if (on) c.classList.add('on');
    const v = on ? c.dataset.opt : '';
    if (f) setAns(s, q, { sub: Object.assign({}, ans(s, q).sub, { [f]: v }), skipped: false });
    else setAns(s, q, { value: v, skipped: false });
    onChange && onChange(q, true);
  });
}
function vSoldier(root) {
  const s = S.soldiers[route.id]; if (!s) return back();
  const mode = route.mode || S.settings.mode || 'wizard';
  const T = S.template;
  root.innerHTML = `
  <header class="top"><button class="icon-btn" data-back aria-label="חזרה">${svg('back')}</button><h1>${esc(fullName(s))}</h1>
    <button class="icon-btn" data-export aria-label="ייצוא">${svg('share')}</button>
    <button class="icon-btn" data-menu aria-label="עוד">${svg('dots')}</button></header>
  <main>
    <div class="tabs"><button data-m="wizard" class="${mode === 'wizard' ? 'on' : ''}">ראיון</button><button data-m="form" class="${mode === 'form' ? 'on' : ''}">כל השאלות</button></div>
    <div id="body"></div>
  </main>`;
  const body = $('#body', root);
  root.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { route.mode = b.dataset.m; S.settings.mode = b.dataset.m; save(); render(); });
  $('[data-back]', root).onclick = back;
  $('[data-export]', root).onclick = () => exportDialog([s], fullName(s));
  $('[data-menu]', root).onclick = () => soldierMenu(s);
  if (mode === 'form') {
    body.innerHTML = `<div class="card"><div class="row"><div class="avatar" style="background:${colorFor(s)}">${esc(initials(s))}</div><div class="grow"><b>${esc(fullName(s))}</b><div class="faint">ראיון: ${fmtDate(s.interviewDate)}${s.interviewer ? ' · ' + esc(s.interviewer) : ''}</div></div><div class="ring" style="--p:${pct(s)}"><span>${pct(s)}%</span></div></div>
      <div class="badges" style="margin-top:8px">${S.lists.filter(l => l.members.includes(s.id)).map(l => `<span class="badge b">${esc(l.name)}</span>`).join('')}</div></div>`
      + T.map((q, i) => questionHTML(s, q, i, false)).join('');
    bindAnswers(body, s, (q, chip) => { if (!chip) { const el = body.querySelector(`[data-q="${q.id}"]`); const n = document.createElement('div'); n.innerHTML = questionHTML(s, q, T.indexOf(q), false); el.replaceWith(n.firstElementChild); } });
    if (route.focus) { const el = body.querySelector(`[data-q="${route.focus}"]`); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 30); route.focus = null; }
    return;
  }
  // interview: one question per screen
  let i = route.i ?? Math.max(0, T.findIndex(q => !filled(s, q) && !ans(s, q).skipped));
  if (i < 0 || i >= T.length) i = 0;
  const draw = () => {
    route.i = i;
    const q = T[i];
    body.innerHTML = `<div class="row" style="margin-bottom:6px"><span class="faint grow">שאלה ${i + 1} מתוך ${T.length}</span><span class="faint">${pct(s)}% מולא</span></div>
      <div class="progress"><i style="width:${(i + 1) / T.length * 100}%"></i></div>
      <div class="card" style="margin-top:12px">${questionHTML(s, q, i, true)}</div>`;
    const first = body.querySelector('input:not([type=date]),textarea'); if (first && q.type !== 'choice' && q.type !== 'date' && !matchMedia('(pointer:coarse)').matches) first.focus();
    nav.querySelector('[data-prev]').disabled = i === 0;
    nav.querySelector('[data-next]').innerHTML = i === T.length - 1 ? `${svg('check')} סיום` : 'הבא';
  };
  const nav = document.createElement('div'); nav.className = 'wiz-nav';
  nav.innerHTML = `<button class="btn ghost" data-prev>הקודם</button><button class="btn" data-skip>${svg('skip')} דלג</button><button class="btn primary" data-next>הבא</button>`;
  root.append(nav);
  nav.querySelector('[data-prev]').onclick = () => { if (i > 0) { i--; draw(); } };
  nav.querySelector('[data-next]').onclick = () => {
    if (i < T.length - 1) { i++; draw(); window.scrollTo(0, 0); return; }
    const miss = T.filter(q => !filled(s, q));
    toast(miss.length ? `נשמר. חסרות ${miss.length} שאלות` : 'הדבב הושלם ✓');
    route.mode = 'form'; render();
  };
  nav.querySelector('[data-skip]').onclick = () => { setAns(s, T[i], { skipped: true }); if (i < T.length - 1) { i++; draw(); } else nav.querySelector('[data-next]').click(); };
  bindAnswers(body, s, (q, chip) => {
    if (chip && q.type === 'choice') setTimeout(() => { if (i < T.length - 1 && T[i] === q) { i++; draw(); } }, 280);   // picked an option: on to the next question
    else if (!chip) draw();
  });
  draw();
}

  setTimeout(() => { window.print(); document.title = oldTitle; }, 100);
  toast(/iPhone|iPad/.test(navigator.userAgent) ? 'בחלון ההדפסה: כפתור השיתוף ← שמירה בקבצים' : 'בחלון ההדפסה בוחרים "שמירה כ-PDF"');
}
const safeName = s => s.replace(/[\\/:*?"<>|]/g, '').trim() || 'דבב';

function exportDialog(sol, title) {
  if (!sol.length) { toast('אין חיילים לייצא'); return; }
  const T = S.template;
  let fmt = 'xlsx';
  sheet(`<h2>ייצוא: ${esc(title)}</h2><p class="muted">${sol.length === 1 ? 'החייל' : sol.length + ' חיילים'}</p>
    <div class="chips" data-fmt>${[['xlsx', 'אקסל'], ['docx', 'וורד'], ['pdf', 'PDF'], ['txt', 'טקסט (ל-Claude)']].map(([k, l]) => `<button class="chip ${k === fmt ? 'on' : ''}" data-v="${k}">${l}</button>`).join('')}</div>
    <label class="lbl" style="margin-top:14px">אילו שאלות לכלול</label>
    <div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:6px"><button class="btn ghost" data-all>הכול</button><button class="btn ghost" data-noid>בלי מידע מזהה</button><button class="btn ghost" data-none>כלום</button></div>
    <div data-qs style="max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 8px">${T.map(q => `<label class="check-row"><input type="checkbox" data-q="${q.id}" checked><span>${esc(q.title)}${q.sensitive ? ' <span class="badge y">מזהה</span>' : ''}</span></label>`).join('')}</div>
    <button class="btn primary block" style="margin-top:14px" data-go>${svg('share')} ייצוא</button>`, (el, close) => {
    el.querySelectorAll('[data-fmt] .chip').forEach(c => c.onclick = () => { el.querySelectorAll('[data-fmt] .chip').forEach(z => z.classList.remove('on')); c.classList.add('on'); fmt = c.dataset.v;
      if (fmt === 'txt') el.querySelectorAll('[data-q]').forEach(b => b.checked = !T.find(q => q.id === b.dataset.q).sensitive); });
    const set = f => el.querySelectorAll('[data-q]').forEach(b => b.checked = f(T.find(q => q.id === b.dataset.q)));
    $('[data-all]', el).onclick = () => set(() => true);
    $('[data-noid]', el).onclick = () => set(q => !q.sensitive);
    $('[data-none]', el).onclick = () => set(() => false);
    $('[data-go]', el).onclick = () => {
      const qs = T.filter(q => el.querySelector(`[data-q="${q.id}"]`).checked);
      const name = safeName(title) + ' – דבב';
      if (fmt === 'xlsx') download(name + '.xlsx', xlsx(sol, qs), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      if (fmt === 'docx') download(name + '.docx', docx(sol, qs, title), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      if (fmt === 'txt') download(name + '.txt', txt(sol, qs, title), 'text/plain;charset=utf-8');
      if (fmt === 'pdf') printPdf(printHtml(sol, qs, title), name);
      close();
    };
  });
}

// ---------- dabab files: a list for another commander, or a full backup
function shareList(l) {
  const sol = Object.fromEntries(l.members.filter(id => S.soldiers[id]).map(id => [id, S.soldiers[id]]));
  download(safeName(l.name) + '.dabab', JSON.stringify({ dabab: 1, kind: 'list', template: S.template, lists: [l], soldiers: sol }), 'application/json');
}
function backup() {
  download(`גיבוי דבב ${new Date().toLocaleDateString('he-IL').replace(/\./g, '-')}.dabab`, JSON.stringify({ dabab: 1, kind: 'backup', template: S.template, lists: S.lists, soldiers: S.soldiers, settings: { ...S.settings } }), 'application/json');
  S.settings.lastBackup = Date.now(); save(); if (route.name === 'home' || route.name === 'settings') render();
}
async function importFile(f) {
  let d;
  try { d = JSON.parse(await f.text()); } catch (e) { toast('זה לא קובץ דבב'); return; }
  if (!d || !d.dabab || !d.lists) { toast('זה לא קובץ דבב'); return; }
  const n = Object.keys(d.soldiers || {}).length;
  const msg = d.kind === 'backup' ? `קובץ גיבוי: ${d.lists.length} רשימות, ${n} חיילים. להוסיף למה שכבר יש?` : `רשימה "${d.lists[0].name}" עם ${n} חיילים. להוסיף?`;
  if (!await confirmBox(msg, 'הוספה', false)) return;
  // questions this device doesn't have yet are added to the template, so no answer is lost
  for (const q of d.template || []) if (!S.template.some(t => t.id === q.id)) S.template.push(q);
  const idQ = byKey('id');
  const map = {};
  for (const [id, s] of Object.entries(d.soldiers || {})) {
    const tz = idQ && (s.answers || {})[idQ.id] && s.answers[idQ.id].value;
    const same = Object.values(S.soldiers).find(o => o.id === id || (tz && idQ && ans(o, idQ).value === tz));
    if (same) { if ((s.updated || 0) > (same.updated || 0)) Object.assign(same, s, { id: same.id }); map[id] = same.id; }
    else { const nid = S.soldiers[id] ? uid() : id; S.soldiers[nid] = { ...s, id: nid }; map[id] = nid; }
  }
  for (const l of d.lists) {
    const mine = S.lists.find(x => x.id === l.id) || S.lists.find(x => x.name === l.name);
    const members = l.members.map(id => map[id]).filter(Boolean);
    if (mine) mine.members = [...new Set([...mine.members, ...members])];
    else S.lists.push({ ...l, members });
  }
  if (d.kind === 'backup' && d.settings) S.settings.lastBackup = Date.now();
  save(); go({ name: 'home' }, false); toast('נוסף ✓');
}

// ====================================================================== lock screen and start
function lockScreen() {
  let pin = '';
  const el = document.createElement('div'); el.className = 'lock';
  el.innerHTML = `<div style="text-align:center"><div class="avatar" style="background:var(--acc);margin:0 auto;width:64px;height:64px">${svg('lock', 'width="30" height="30"')}</div>
    <h2 style="margin:14px 0 0">דבב</h2><div class="muted">הקלידו את הקוד</div><div class="pin-dots"></div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => `<button ${k === '' ? 'style="visibility:hidden"' : ''} data-k="${k}">${k}</button>`).join('')}</div>
    <button class="btn" style="margin-top:16px" data-ok>כניסה</button></div>`;
  document.body.append(el);
  const dots = () => { el.querySelector('.pin-dots').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join(''); };
  const tryIt = async () => {
    try { await unlock(pin); el.remove(); render(); }
    catch (e) { pin = ''; dots(); toast('קוד שגוי'); }
  };
  el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === '⌫') pin = pin.slice(0, -1); else if (k !== '') pin += k; dots(); });
  el.querySelector('[data-ok]').onclick = tryIt;
  document.addEventListener('keydown', function kd(e) { if (!document.body.contains(el)) return document.removeEventListener('keydown', kd); if (/^\d$/.test(e.key)) pin += e.key; if (e.key === 'Backspace') pin = pin.slice(0, -1); if (e.key === 'Enter') tryIt(); dots(); });
  dots();
}
window.__dababImport = (name, text) => importFile({ text: async () => text });   // a file opened with the Android app
if (meta().locked && localStorage.getItem(ENC)) { S = blank(); lockScreen(); }
else { loadPlain(); render(); }
</script>
